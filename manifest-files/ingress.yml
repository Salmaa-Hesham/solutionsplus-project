apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: my-app.local  # Replace with your desired local domain
    http:
      paths:
      - path: /
        backend:
          service:
            name: my-app-service
            port:
              number: 4040  # Matches the Service port
